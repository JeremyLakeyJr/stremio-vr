services:
  cinema:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      BROWSER_SERVICE_URL: http://browser:9000
      STREAMING_SERVICE_URL: http://stremio:11470
      MEDIA_ALLOWED_HOSTS: stremio:11470
      TUNNEL_LINK_FILE: /share/link.json
      ICE_SERVERS: ${ICE_SERVERS:-[{"urls":"stun:stun.cloudflare.com:3478"}]}
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
      MEDIA_MAX_JOBS: "2"
      MEDIA_MAX_BYTES: "8589934592"
    volumes:
      - tunnel-link:/share:ro
    depends_on:
      - stremio
      - browser
    restart: unless-stopped
  browser:
    build:
      context: .
      dockerfile: Dockerfile.browser
    volumes:
      - browser-profiles:/data
    tmpfs:
      - /tmp:size=2147483648,mode=1777
    shm_size: 1gb
    stop_grace_period: 45s
    restart: unless-stopped
  stremio:
    image: stremio/server:latest
    # Internal upstream only; clients use Movie Night's /media endpoint.
    expose:
      - "11470"
    environment:
      APP_PATH: /data
    volumes:
      - stremio-data:/data
    restart: unless-stopped
  internet:
    build:
      context: .
      dockerfile: Dockerfile.tunnel
    volumes:
      - tunnel-link:/share
    depends_on:
      cinema:
        condition: service_healthy
    restart: unless-stopped

volumes:
  browser-profiles:
  stremio-data:
  tunnel-link:
