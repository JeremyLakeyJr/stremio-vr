services:
  cinema:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      BROWSER_SERVICE_URL: http://browser:9000
      STREAMING_SERVICE_URL: ${STREAMING_SERVICE_URL:-http://stremio:11470}
      # Allow Stremio + any local/private Jellyfin (8096), Remux (8096), Silo, or MediaStorm servers
      MEDIA_ALLOWED_HOSTS: ${MEDIA_ALLOWED_HOSTS:-stremio:11470}
      ALLOW_PRIVATE_NETWORKS: ${ALLOW_PRIVATE_NETWORKS:-true}
      JELLYFIN_URL: ${JELLYFIN_URL:-}
      REMUX_URL: ${REMUX_URL:-}
      MEDIASTORM_URL: ${MEDIASTORM_URL:-}
      MEDIASTORM_KEY: ${MEDIASTORM_KEY:-}
      SILO_URL: ${SILO_URL:-}
      SOURCE_URL: ${SOURCE_URL:-https://github.com/oOflyeyesOo/Media-VR}
      TUNNEL_LINK_FILE: /share/link.json
      ICE_SERVERS: ${ICE_SERVERS:-[{"urls":"stun:stun.cloudflare.com:3478"}]}
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
      FFMPEG_BINARY: ${FFMPEG_BINARY:-ffmpeg}
      MEDIA_MAX_JOBS: ${MEDIA_MAX_JOBS:-4}
      MEDIA_MAX_BYTES: ${MEDIA_MAX_BYTES:-25769803776}
      MEDIA_MAX_HEIGHT: ${MEDIA_MAX_HEIGHT:-1080}
      MEDIA_MAX_FPS: ${MEDIA_MAX_FPS:-60}
      MEDIA_VIDEO_BITRATE: ${MEDIA_VIDEO_BITRATE:-15M}
      MEDIA_DISABLE_REMUX: ${MEDIA_DISABLE_REMUX:-false}
      VAAPI_DEVICE: ${VAAPI_DEVICE:-/dev/dri/renderD128}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      APPRISE_URL: ${APPRISE_URL:-}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
      OPENSUBTITLES_API_KEY: ${OPENSUBTITLES_API_KEY:-}
    volumes:
      - tunnel-link:/share:ro
    depends_on:
      - stremio
      - browser
    restart: unless-stopped
  browser:
    build:
      context: .
      dockerfile: Dockerfile.browser
    volumes:
      - browser-profiles:/data
    tmpfs:
      - /tmp:size=2147483648,mode=1777
    shm_size: 1gb
    stop_grace_period: 45s
    restart: unless-stopped
  stremio:
    image: stremio/server:latest
    # Internal upstream only; clients use Movie Night's /media endpoint.
    expose:
      - "11470"
    environment:
      APP_PATH: /data
    volumes:
      - stremio-data:/data
    restart: unless-stopped
  internet:
    build:
      context: .
      dockerfile: Dockerfile.tunnel
    environment:
      # Optional Cloudflare Zero Trust / Argo Named Tunnel Token:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
      TUNNEL_URL: ${TUNNEL_URL:-}
      TUNNEL_HOSTNAME: ${TUNNEL_HOSTNAME:-}
    volumes:
      - tunnel-link:/share
    depends_on:
      cinema:
        condition: service_healthy
    restart: unless-stopped

volumes:
  browser-profiles:
  stremio-data:
  tunnel-link:
