name: Build Quest APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (optional, e.g. v1.0.0)'
        required: false
        default: 'manual-build'
  release:
    types: [published]

jobs:
  build-quest-apk:
    name: Build Meta Quest APK (IL2CPP / Android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: unity/Library
          key: Library-Quest-${{ hashFiles('unity/Assets/**', 'unity/Packages/**') }}
          restore-keys: |
            Library-Quest-

      - name: Build Unity Android Package
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          targetPlatform: Android
          buildName: movie-night
          outputPath: build/Android

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: movie-night-quest-apk
          path: build/Android/*.apk
          if-no-files-found: ignore
          retention-days: 14
