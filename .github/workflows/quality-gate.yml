name: Quality Gate

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  node:
    name: Node tests and checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run syntax and solo checks
        run: |
          npm run check
          npm run check:solo
          npm run check:repository

  core:
    name: Rust core tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run locked core tests
        run: npm run test:core

  docker:
    name: Docker preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Run Docker smoke test
        run: npm run docker-smoke
